name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  build:
    name: Build & Test Expo App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Verify Expo build (no publish)
        run: CI=1 npx expo prebuild
